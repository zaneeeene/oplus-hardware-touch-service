[package]
name = "oplus-hardware-touch-service"
version = "1.0.0"
edition = "2021"
description = "OPlus hardware touch service for Redmi Note 12 4G (topaz/SM6225) - AOD, DT2W, Gestures"
license = "GPL-2.0-only"
repository = "https://github.com/zaneeeene/oplus-hardware-touch-service"

[lib]
name = "oplus_hardware_touch_service"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "oplus-hardware-touch-service"
path = "src/bin/main.rs"

[dependencies]
libc = { version = "0.2", features = ["extra_traits"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "signal"] }
nix = { version = "0.27", features = ["fs", "poll", "event", "ioctl"] }
clap = { version = "4.0", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[features]
default = ["vendor"]
vendor = []
gesture-backlight = []

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: |
          cargo test --locked --all-targets
          cargo test --locked --all-targets --features gesture-backlight

      - name: Validate shell scripts
        run: |
          bash -n build.sh
          bash -n tools/capture-aod-dt2w-logs.sh
          sh -n tools/android-linker.sh

  android-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gesture-variant: [stable, backlight]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build AArch64 vendor package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./build.sh --gesture-variant "${{ matrix.gesture-variant }}"
